document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

flow:ellipsis; white-space:nowrap; cursor:text;\">{{ g.name }}<\u002Fspan>\n              <button onclick=\"{{ g.onAddProject }}\" title=\"Nuevo proyecto\" style=\"border:none; background:none; cursor:pointer; font-size:17px; line-height:1; color:oklch(0.6 0.02 260); width:20px; height:20px; border-radius:6px; flex:none;\">+<\u002Fbutton>\n              <button onclick=\"{{ g.onDelete }}\" title=\"Eliminar grupo\" style=\"border:none; background:none; cursor:pointer; font-size:15px; line-height:1; color:oklch(0.65 0.02 260); width:20px; height:20px; border-radius:6px; flex:none;\">×<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex; flex-direction:column; gap:2px; padding-left:6px;\">\n              <sc-for list=\"{{ g.projects }}\" as=\"p\" hint-placeholder-count=\"2\">\n                <div onclick=\"{{ p.onSelect }}\" draggable=\"true\" ondragstart=\"{{ p.onDragStart }}\" ondragover=\"{{ p.onDragOver }}\" ondrop=\"{{ p.onDrop }}\" ondragend=\"{{ p.onDragEnd }}\" style=\"{{ p.style }}\">\n                  <span style=\"width:9px; height:9px; border-radius:50%; flex:none; background:{{ p.color }}; cursor:grab;\"><\u002Fspan>\n                  <sc-if value=\"{{ p.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                    <input value=\"{{ editDraft }}\" onchange=\"{{ setEditDraft }}\" onkeydown=\"{{ editKey }}\" onclick=\"{{ stop }}\" autofocus=\"true\" style=\"flex:1; font-size:14px; border:1px solid oklch(0.6 0.13 190); border-radius:6px; padding:2px 6px; color:inherit; min-width:0;\">\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ p.notEditing }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span ondoubleclick=\"{{ p.onRename }}\" title=\"Doble clic para renombrar\" style=\"flex:1; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ p.name }}<\u002Fspan>\n                    <span style=\"font-size:12px; color:oklch(0.6 0.02 260); font-variant-numeric:tabular-nums;\">{{ p.count }}<\u002Fspan>\n                    <button onclick=\"{{ p.onDelete }}\" title=\"Eliminar proyecto\" style=\"border:none; background:none; cursor:pointer; font-size:15px; line-height:1; color:oklch(0.65 0.02 260); width:18px; height:18px; border-radius:5px; flex:none;\">×<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <sc-if value=\"{{ g.noProjects }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:12.5px; color:oklch(0.65 0.02 260); padding:5px 10px;\">Sin proyectos<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid oklch(0.9 0.008 95); padding-top:14px; margin-top:8px; display:flex; flex-direction:column; gap:6px;\">\n      <button onclick=\"{{ syncNow }}\" style=\"{{ syncBtnStyle }}\"><span style=\"font-size:14px;\">☁<\u002Fspan>{{ syncBtnLabel }}<\u002Fbutton>\n      <div style=\"display:flex; align-items:center; justify-content:space-between; gap:8px; padding:1px 4px 5px;\">\n        <span style=\"font-size:11.5px; color:{{ syncStatusColor }}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ syncLabel }}<\u002Fspan>\n        <button onclick=\"{{ openSync }}\" title=\"Configurar sincronización\" style=\"border:none; background:none; cursor:pointer; color:oklch(0.55 0.02 260); font-size:14px; flex:none; line-height:1;\">⚙<\u002Fbutton>\n      <\u002Fdiv>\n      <button onclick=\"{{ exportData }}\" style=\"display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid oklch(0.9 0.008 95); background:oklch(0.99 0.004 95); border-radius:9px; padding:8px 12px; cursor:pointer; font-size:13px; font-weight:600; color:oklch(0.4 0.02 260);\" style-hover=\"border-colo const over = this.state.dragOverProjId === p.id && this.dragProjId && this.dragProjId !== p.id;\n        rows.push({\n          label: p.name, showDot: true,\n          dotStyle: `width:9px; height:9px; border-radius:50%; flex:none; background:${p.color};`,\n          hasBar, barStyle, barText, hasPoint: false,\n          onLabelClick: () => this.goToProject(p.id),\n          labelDraggable: true,\n          onLabelDragStart: (e) => { this.dragProjId = p.id; if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move'; },\n          onLabelDragOver: (e) => { e.preventDefault(); if (this.state.dragOverProjId !== p.id) this.setState({ dragOverProjId: p.id }); },\n          onLabelDrop: (e) => { e.preventDefault(); e.stopPropagation(); this.moveProject(this.dragProjId, p.id); this.dragProjId = null; this.setState({ dragOverProjId: null }); },\n          onLabelDragEnd: () => { this.dragProjId = null; this.setState({ dragOverProjId: null }); },\n          rowStyle: `display:flex; align-items:stretch; border-bottom:1px solid oklch(0.95 0.006 95); ${active ? 'background:oklch(0.98 0.006 190);' : ''}`,\n          labelStyle: `width:${LW}px; flex:none; position:sticky; left:0; z-index:2; background:${active ? 'oklch(0.975 0.008 190)' : 'oklch(0.985 0.004 95)'}; display:flex; align-items:center; gap:8px; padding:0 14px; height:40px; font-size:13.5px; font-weight:700; color:oklch(0.3 0.02 260); border-right:1px solid oklch(0.9 0.008 95); cursor:grab; box-shadow:${over ? 'inset 0 3px 0 -1px oklch(0.6 0.13 190)' : 'none'};`,\n          trackStyle: `position:relative; flex:none; width:${totalWidth}px; height:40px; background:${grid};`,\n        });\n        tasks.filter(t => t.projectId === p.id && t.dueDate && !t.parentId).sort((a,b) => a.order - b.order).forEach(t => {\n          const d = this.parseDate(t.dueDate); if (!d) return;\n          const a = idx(d);\n          rows.push({\n            label: t.title, showDot: true,\n            dotStyle: `width:6px; height:6px; border-radius:50%; flex:none; background:${t.priority ? this.PRIO : p.color}; opacity:${t.priority?1:0.6};`,\n            hasBar: false, hasPoint: true,\n            onLabelClick: () => this.goToProject(p.id),\n            pointStyle: `position:absolute; left:${a*DW+DW*0.16}px; top:8px; width:${DW*0.68}px; height:15px; border-radius:5px; background:${t.done ? 'oklch(0.85 0.03 145)' : (t.priority ? this.PRIO : p.color)}; ${t.done ? 'opacity:0.6;' : ''}`,\n            rowStyle: 'display:flex; align-items:stretch; border-bottom:1px solid oklch(0.96 0.006 95);',\n            labelStyle: `width:${LW}px; flex:none; position:sticky; left:0; z-index:2; background:oklch(0.985 0.004 95); display:flex; align-items:center; gap:8px; padding:0 14px 0 28px; height:30px; font-size:12.5px; font-weight:${t.priority?600:400}; color:${t.done ? 'oklch(0.68 0.01 260)' : 'oklch(0.42 0.02 260)'}; border-right:1px solid oklch(0.9 0.008 95); cursor:pointer;`,\n            trackStyle: `position:relative; flex:none; width:${totalWidth}px; height:30px; background:${grid};`,\n          });\n        });\n      });\n    });\n    const hasToday = idx(today) >= 0 && idx(today) < dayCount;\n    const todayLineStyle = `position:absolute; top:0; bottom:0; left:${LW + idx(today)*DW + DW/2}px; width:2px; background:oklch(0.6 0.13 190); z-index:4; pointer-events:none;`;\n    this._ganttScrollTarget = Math.max(0, (idx(today) - 5) * DW);\n    const weekendBands = [];\n    for (let i = 0; i < dayCount; i++) {\n      const d = new Date(min.getTime() + i * dayMs);\n      const dow = d.getDay();\n      if (dow === 6) {\n        const w = (i + 1 < dayCount) ? 2 * DW : DW; // sábado + domingo\n        weekendBands.push({ style: `position:absolute; top:0; bottom:0; left:${LW + i*DW}px; width:${w}px; background:oklch(0.9 0.011 255 / 0.6); z-index:0; pointer-events:none;` });\n      } else if (dow === 0 && i === 0) {\n        weekendBands.push({ style: `position:absolute; top:0; bottom:0; left:${LW}px; width:${DW}px; background:oklch(0.9 0.011 255 / 0.6); z-index:0; pointer-events:none;` });\n      }\n    }\n    return { ready: rows.length > 0, days, rows, totalWidth, hasToday, todayLineStyle, weekendBands };\n  }\n\n  renderVals() {\n    const { view } = this.state;\n\n    const groups = this.state.groups.map(g => {\n      const open = !this.state.collapsedGroups[g.id];\n      const editingG = this.isEditing('group', g.id);\n      const projs = this.state.projects.filter(p => p.groupId === g.id).sort((a,b) => (a.order||0) - (b.order||0)).map(p => {\n        const count = this.state.tasks.filter(t => t.projectId === p.id && !t.done && !t.parentId).length;\n        const active = p.id === this.state.activeProjectId;\n        const editingP = this.isEditing('project', p.id);\n        const over = this.state.dragOverProjId === p.id && this.dragProjId && this.dragProjId !== p.id;\n        return {\n          id: p.id, name: p.name, color: p.color, count,\n          editing: editingP, notEditing: !editingP,\n          style: `display:flex; align-items:center; gap:9px; width:100%; cursor:pointer; padding:6px 9px; border-radius:9px; font-size:12.5px; font-weight:${active?700:500}; color:${active?'oklch(0.28 0.02 260)':'oklch(0.42 0.02 260)'}; background:${active?'white':'transparent'}; box-shadow:${active?'0 1px 3px oklch(0.5 0.02 260 / 0.08)':(over?'inset 0 2px 0 -1px oklch(0.6 0.13 190)':'none')};`,\n          onSelect: () => this.goToProject(p.id),\n          onRename: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.startEdit('project', p.id, p.name); },\n          onDelete: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.deleteProject(p.id); },\n          onDragStart: (e) => { this.dragProjId = p.id; if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move'; },\n          onDragOver: (e) => { e.preventDefault(); if (this.state.dragOverProjId !== p.id) this.setState({ dragOverProjId: p.id }); },\n          onDrop: (e) => { e.preventDefault(); e.stopPropagation(); this.moveProject(this.dragProjId, p.id); this.dragProjId = null; this.setState({ dragOverProjId: null }); },\n          onDragEnd: () => { this.dragProjId = null; this.setState({ dragOverProjId: null }); },\n        };\n      });\n      return {\n        id: g.id, name: g.name, open, caret: open ? '▾' : '▸',\n        editing: editingG, notEditing: !editingG,\n        projects: projs, noProjects: projs.length === 0,\n        onToggle: () => this.set({ collapsedGroups: { ...this.state.collapsedGroups, [g.id]: open } }),\n        onAddProject: () => this.addProject(g.id),\n        onRename: () => this.startEdit('group', g.id, g.name),\n        onDelete: () => this.deleteGroup(g.id),\n      };\n    });\n\n    const tab = (on) => `flex:1; border:none; cursor:pointer; padding:7px 2px; border-radius:8px; font-size:12.5px; font-weight:700; color:${on?'oklch(0.28 0.02 260)':'oklch(0.5 0.02 260)'}; background:${on?'white':'transparent'}; box-shadow:${on?'0 1px 3px oklch(0.5 0.02 260 / 0.1)':'none'};`;\n\n    const listGroups = view === 'list' ? this.buildList() : [];\n    const columns = view === 'board' ? this.buildColumns() : [];\n    const gantt = view === 'gantt' ? this.buildGantt() : { ready: false, days: [], rows: [] };\n\n    const cal = view === 'cal' ? this.buildCalendar() : { cells: [], monthLabel: '' };\n    const sel = this.state.selected ? new Date(this.state.selected + 'T00:00:00') : new Date();\n    const colorOf = {}, nameOf = {};\n    this.state.projects.forEach(p => { colorOf[p.id] = p.color; nameOf[p.id] = p.name; });\n    const selTasks = (this.state.selected ? this.state.tasks.filter(t => t.dueDate === this.state.selected) : []).map(t => {\n      const col = colorOf[t.projectId] || 'oklch(0.6 0.02 260)';\n      return {\n        title: t.title, color: col, project: nameOf[t.projectId] || '', check: t.done ? '✓' : '', prio: !!t.priority,\n        indStyle: `width:18px; height:18px; flex:none; border-radius:6px; border:2px solid ${t.done?col:'oklch(0. '].map((label, i) => ({\n        label,\n        style: `font-size:12px; font-weight:700; text-align:center; letter-spacing:0.04em; color:${i >= 5 ? 'oklch(0.5 0.03 255)' : 'oklch(0.6 0.02 260)'};`,\n      })),\n      cells: cal.cells,\n      monthLabel: cal.monthLabel,\n      prevMonth: () => this.setState(s => ({ cursor: { y: s.cursor.m === 0 ? s.cursor.y-1 : s.cursor.y, m: (s.cursor.m+11)%12 } })),\n      nextMonth: () => this.setState(s => ({ cursor: { y: s.cursor.m === 11 ? s.cursor.y+1 : s.cursor.y, m: (s.cursor.m+1)%12 } })),\n      today: () => { const n = new Date(); this.setState({ cursor: { y: n.getFullYear(), m: n.getMonth() }, selected: this.iso(n) }); },\n      selWeekday: new Intl.DateTimeFormat('es', { weekday: 'long' }).format(sel).replace(/^./, c => c.toUpperCase()),\n      selDayLabel: new Intl.DateTimeFormat('es', { day: 'numeric', month: 'long' }).format(sel),\n      selTasks,\n      selEmpty: selTasks.length === 0,\n\n      ganttReady: gantt.ready,\n      ganttEmpty: view === 'gantt' && !gantt.ready,\n      gdays: gantt.days,\n      grows: gantt.rows,\n      hasToday: gantt.hasToday,\n      todayLineStyle: gantt.todayLineStyle,\n      weekendBands: gantt.weekendBands || [],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
