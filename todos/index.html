<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Panel — Tasks &amp; Calendar</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<main id="app">

  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Mi Panel de Tasks &amp; Calendar</h1>
      <p>Conecta tu cuenta de Google para ver tus listas de tareas como un tablero Kanban y tu calendario, con sincronización directa contra la API de Google.</p>
      <button id="loginBtnCenter" class="btn btn-primary btn-lg" type="button">Conectar con Google</button>
      <p class="login-note" id="configWarning" hidden>
        ⚠️ Falta configurar el <code>CLIENT_ID</code> en <code>js/config.js</code>. Revisa el README.
      </p>
    </div>
  </section>

  <section id="boardView" class="view" hidden>
    <div class="board-toolbar">
      <div class="board-toolbar-actions">
        <label class="switch">
          <input type="checkbox" id="toggleCompleted">
          <span>Mostrar completadas</span>
        </label>
        <button id="newListBtn" class="btn btn-secondary" type="button">+ Nueva lista</button>
        <button id="refreshBtn" class="icon-btn" type="button" title="Actualizar">⟳</button>
        <button id="logoutBtn" class="btn btn-ghost" type="button">Salir</button>
      </div>
    </div>
    <div id="board" class="board" aria-live="polite"></div>
  </section>

  <div id="toastHost" class="toast-host" aria-live="polite"></div>
</main>

<!-- Modal genérico para tarea -->
<dialog id="taskModal" class="modal">
  <form method="dialog" id="taskForm" class="modal-form">
    <h3 id="taskModalTitle">Nueva tarea</h3>
    <label>Título
      <input type="text" id="taskTitle" required maxlength="1024">
    </label>
    <label>Notas
      <textarea id="taskNotes" rows="3" maxlength="8192"></textarea>
    </label>
    <label>Fecha de vencimiento
      <input type="date" id="taskDue">
    </label>
    <div class="modal-actions">
      <button type="button" id="taskDeleteBtn" class="btn btn-danger" hidden>Eliminar</button>
      <span class="spacer"></span>
      <button type="button" id="taskCancelBtn" class="btn btn-ghost">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Modal para lista nueva -->
<dialog id="listModal" class="modal">
  <form method="dialog" id="listForm" class="modal-form">
    <h3>Nueva lista</h3>
    <label>Nombre
      <input type="text" id="listTitle" required maxlength="1024">
    </label>
    <div class="modal-actions">
      <span class="spacer"></span>
      <button type="button" id="listCancelBtn" class="btn btn-ghost">Cancelar</button>
      <button type="submit" class="btn btn-primary">Crear</button>
    </div>
  </form>
</dialog>

<!-- Modal para evento -->
<dialog id="eventModal" class="modal">
  <form method="dialog" id="eventForm" class="modal-form">
    <h3 id="eventModalTitle">Nuevo evento</h3>
    <label>Título
      <input type="text" id="eventTitle" required maxlength="1024">
    </label>
    <label class="checkbox-line">
      <input type="checkbox" id="eventAllDay">
      Todo el día
    </label>
    <div class="grid-2">
      <label>Fecha inicio
        <input type="date" id="eventStartDate" required>
      </label>
      <label id="eventStartTimeWrap">Hora inicio
        <input type="time" id="eventStartTime">
      </label>
    </div>
    <div class="grid-2">
      <label>Fecha fin
        <input type="date" id="eventEndDate" required>
      </label>
      <label id="eventEndTimeWrap">Hora fin
        <input type="time" id="eventEndTime">
      </label>
    </div>
    <label>Descripción
      <textarea id="eventDescription" rows="3"></textarea>
    </label>
    <div class="modal-actions">
      <button type="button" id="eventDeleteBtn" class="btn btn-danger" hidden>Eliminar</button>
      <span class="spacer"></span>
      <button type="button" id="eventCancelBtn" class="btn btn-ghost">Cancelar</button>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Modal detalle de día (agenda) -->
<dialog id="dayModal" class="modal">
  <div class="modal-form">
    <h3 id="dayModalTitle">—</h3>
    <div id="dayAgendaList" class="day-agenda-list"></div>
    <div class="modal-actions">
      <span class="spacer"></span>
      <button type="button" id="dayModalAddBtn" class="btn btn-secondary">+ Evento este día</button>
      <button type="button" id="dayModalCloseBtn" class="btn btn-ghost">Cerrar</button>
    </div>
  </div>
</dialog>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/board.js"></script>
<!-- Calendario desactivado por ahora (ver js/calendarView.js) — vuelve a añadir este script
     y las piezas comentadas en app.js/index.html para reactivarlo. -->
<script src="js/app.js"></script>
</body>
</html>
