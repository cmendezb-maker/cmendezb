<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugares y Momentos</title>
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            color: #111;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .header-wrapper {
            width: 100%;
            background: #fff;
            padding-top: 40px;
            padding-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .header-wrapper h1 {
            font-weight: 800;
            font-size: clamp(3rem, 12vw, 8rem);
            letter-spacing: -0.05em;
            text-transform: uppercase;
            line-height: 0.8;
            text-align: center;
            will-change: transform, opacity;
        }

        /* --- MAPA STYLES --- */
        :root{
            --bg:#f7f6f2;
            --panel:#ffffff;
            --ink:#1c1c1a;
            --muted:#6b6a63;
            --line-strong:#a9a79c;
            --dot-default:#185FA5;
            --dot-ring:#ffffff;
            --route-default:#b4b2a9;
            --border:#e4e2d9;
        }

        .map-container {
            width: 100%;
            max-width: 1040px;
            margin: 60px auto;
            padding: 0 24px;
            position: relative;
            z-index: 5;
        }

        .wrap {
            position: relative;
            width: 100%;
            height: 520px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            cursor: grab;
        }

        .wrap.grabbing {
            cursor: grabbing;
        }

        svg {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .route {
            fill: none;
            stroke-width: 1.4;
        }

        .node-label {
            fill: var(--ink);
            pointer-events: none;
        }

        .panel {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 230px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 18px;
            display: none;
            box-shadow: 0 6px 24px rgba(0,0,0,.08);
        }

        .panel .row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .panel h3 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
        }

        .panel .country {
            margin: 6px 0 0;
            font-size: 12px;
            color: var(--line-strong);
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .close {
            border: none;
            background: transparent;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            color: var(--muted);
            padding: 0 2px;
        }

        .close:hover {
            color: var(--ink);
        }

        @keyframes pop {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* --- FOOTER --- */
        footer {
            width: 100%;
            padding: 20px 20px;
            text-align: center;
            background-color: #ffffff;
            position: relative;
            z-index: 10;
        }

        .footer-text {
            font-size: 0.8rem;
            text-transform: none;
            letter-spacing: 0.02em;
            color: #888;
            font-weight: 400;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 700px) {
            .map-container {
                padding: 0 16px;
                margin: 40px auto;
            }
        }

        @media (max-width: 500px) {
            .header-wrapper {
                padding-top: 20px;
            }

            .header-wrapper h1 {
                font-size: 3.5rem;
            }

            .node-label {
                font-size: 11px !important;
            }
        }
    </style>
</head>
<body>

    <div class="header-wrapper" id="header-wrapper">
        <h1 id="header-title">LUGARES Y MOMENTOS</h1>
    </div>

    <div class="map-container">
        <div class="wrap" id="wrap">
            <svg id="map" viewBox="0 0 1000 560">
                <g id="edges"></g>
                <g id="nodes"></g>
            </svg>
            <div class="panel" id="panel">
                <div class="row">
                    <h3 id="p-name"></h3>
                    <button class="close" id="p-close" aria-label="Cerrar">&times;</button>
                </div>
                <p class="country" id="p-country"></p>
                <a id="p-link" href="#" style="display:none; margin-top:12px; padding:8px 12px; background:#3E6DA8; color:white; border-radius:6px; text-decoration:none; font-size:14px; font-weight:500; display:inline-block;">Ver Galería</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  AJUSTES GLOBALES
        // ============================================================
        const ANIMATE = true;
        const DRIFT   = true;
        const DRIFT_AMP = 2.6;
        const DEFAULT_FONT = 13;
        const DEFAULT_DOT  = '#185FA5';
        const DEFAULT_LINE = '#b4b2a9';

        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const animOn  = ANIMATE && !reduceMotion;
        const driftOn = DRIFT   && !reduceMotion;

        const NS = 'http://www.w3.org/2000/svg';

        // ============================================================
        //  LOCALIDADES
        // ============================================================
        const places = [
            {id:'ny',     name:'New York',           country:'EE. UU.',      x:150, y:200, fontSize:15, dotColor:'#B4513B'},
            {id:'edi',    name:'Edimburgo',          country:'Reino Unido',  x:355, y:140, dotColor:'#2E7D5B', lineColor:'#2E7D5B'},
            {id:'hull',   name:'Kingston-upon-Hull', country:'Reino Unido',  x:378, y:200, dotColor:'#2E7D5B', lineColor:'#2E7D5B'},
            {id:'lon',    name:'Londres',            country:'Reino Unido',  x:352, y:265, fontSize:16, dotColor:'#2E7D5B', lineColor:'#2E7D5B'},
            {id:'oslo',   name:'Oslo',               country:'Noruega',      x:520, y:120, dotColor:'#3E6DA8', lineColor:'#3E6DA8'},
            {id:'bergen', name:'Bergen',             country:'Noruega',      x:470, y:95,  dotColor:'#3E6DA8', lineColor:'#3E6DA8'},
            {id:'sogn',   name:'Sognefjord',         country:'Noruega',      x:498, y:75,  dotColor:'#3E6DA8', lineColor:'#3E6DA8'},
            {id:'cop',    name:'Copenhague',         country:'Dinamarca',    x:540, y:190},
            {id:'ams',    name:'Amsterdam',          country:'Paises Bajos', x:455, y:255},
            {id:'ber',    name:'Berlin',             country:'Alemania',     x:565, y:255},
            {id:'par',    name:'Paris',              country:'Francia',      x:440, y:330, fontSize:16},
            {id:'lis',    name:'Lisboa',             country:'Portugal',     x:300, y:400, dotColor:'#C08A2D', lineColor:'#C08A2D'},
            {id:'opo',    name:'Oporto',             country:'Portugal',     x:290, y:355, dotColor:'#C08A2D', lineColor:'#C08A2D'},
            {id:'azores', name:'Azores',             country:'Portugal',     x:70,  y:330, dotColor:'#C08A2D', lineColor:'#C08A2D'},
            {id:'ven',    name:'Venecia',            country:'Italia',       x:560, y:365, dotColor:'#7A4EA3', lineColor:'#7A4EA3'},
            {id:'rom',    name:'Roma',               country:'Italia',       x:575, y:420, fontSize:15, dotColor:'#7A4EA3', lineColor:'#7A4EA3'},
            {id:'ist',    name:'Estambul',           country:'Turquia',      x:680, y:430},
            {id:'pek',    name:'Pekin',              country:'China',        x:800, y:210, dotColor:'#C0392B', lineColor:'#C0392B'},
            {id:'sha',    name:'Shanghai',           country:'China',        x:850, y:280, dotColor:'#C0392B', lineColor:'#C0392B'},
            {id:'tok',    name:'Tokio',              country:'Japon',        x:945, y:230, fontSize:16, dotColor:'#111111', lineColor:'#555555'},
            {id:'kio',    name:'Kioto',              country:'Japon',        x:915, y:295, dotColor:'#111111', lineColor:'#555555'},
            {id:'hir',    name:'Hiroshima',          country:'Japon',        x:875, y:350, dotColor:'#111111', lineColor:'#555555'},
            {id:'miy',    name:'Miyajima',           country:'Japon',        x:905, y:378, dotColor:'#111111', lineColor:'#555555'},
        ];
        const byId = Object.fromEntries(places.map(p => [p.id, p]));

        // ============================================================
        //  CONEXIONES
        // ============================================================
        function buildEdges(){
            const groups = {};
            places.forEach(p => { (groups[p.country] = groups[p.country] || []).push(p.id); });
            const edges = [];
            Object.values(groups).forEach(ids => {
                if (ids.length < 2) return;
                for (let i = 0; i < ids.length - 1; i++) edges.push([ids[i], ids[i+1]]);
                if (ids.length >= 3) edges.push([ids[ids.length-1], ids[0]]);
            });
            return edges;
        }
        const edges = buildEdges();

        // ============================================================
        //  RENDER: CONEXIONES
        // ============================================================
        const gEdges = document.getElementById('edges');
        const lineRefs = [];

        edges.forEach(([a, b]) => {
            const A = byId[a], B = byId[b];
            const color = A.lineColor || DEFAULT_LINE;

            const line = document.createElementNS(NS, 'line');
            line.setAttribute('x1', A.x); line.setAttribute('y1', A.y);
            line.setAttribute('x2', B.x); line.setAttribute('y2', B.y);
            line.setAttribute('class', 'route');
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-linecap', 'round');

            if (animOn){
                const op = document.createElementNS(NS, 'animate');
                op.setAttribute('attributeName','stroke-opacity');
                op.setAttribute('values','0.9;0.4;0.9');
                op.setAttribute('dur','2.4s');
                op.setAttribute('repeatCount','indefinite');
                line.appendChild(op);
            }

            gEdges.appendChild(line);
            lineRefs.push({el: line, a, b});
        });

        // ============================================================
        //  RENDER: PUNTOS
        // ============================================================
        const gNodes = document.getElementById('nodes');
        const nodeRefs = [];

        places.forEach((p, i) => {
            const dotColor = p.dotColor || DEFAULT_DOT;
            const fontSize = p.fontSize || DEFAULT_FONT;

            const g = document.createElementNS(NS, 'g');
            g.style.cursor = 'pointer';

            const pulse = document.createElementNS(NS, 'circle');
            pulse.setAttribute('cx', p.x); pulse.setAttribute('cy', p.y);
            pulse.setAttribute('r', '7');
            pulse.setAttribute('fill', dotColor);
            pulse.setAttribute('opacity', '0.35');
            if (animOn){
                const a1 = document.createElementNS(NS, 'animate');
                a1.setAttribute('attributeName','r'); a1.setAttribute('values','7;16;7');
                a1.setAttribute('dur','2.4s'); a1.setAttribute('repeatCount','indefinite');
                const a2 = document.createElementNS(NS, 'animate');
                a2.setAttribute('attributeName','opacity'); a2.setAttribute('values','0.35;0;0.35');
                a2.setAttribute('dur','2.4s'); a2.setAttribute('repeatCount','indefinite');
                pulse.appendChild(a1); pulse.appendChild(a2);
            } else {
                pulse.setAttribute('opacity','0');
            }

            const dot = document.createElementNS(NS, 'circle');
            dot.setAttribute('cx', p.x); dot.setAttribute('cy', p.y);
            dot.setAttribute('r', '6');
            dot.setAttribute('fill', dotColor);
            dot.setAttribute('stroke', 'var(--dot-ring)');
            dot.setAttribute('stroke-width', '1.5');

            const label = document.createElementNS(NS, 'text');
            label.setAttribute('x', p.x); label.setAttribute('y', p.y - 14);
            label.setAttribute('text-anchor', 'middle');
            label.setAttribute('class', 'node-label');
            label.setAttribute('font-size', fontSize);
            label.textContent = p.name;

            g.appendChild(pulse); g.appendChild(dot); g.appendChild(label);

            if (animOn){
                g.style.opacity = '0';
                g.style.animation = 'pop .6s ease forwards';
                g.style.animationDelay = (0.1 + i * 0.04) + 's';
            }

            g.addEventListener('click', ev => { ev.stopPropagation(); select(p); });
            gNodes.appendChild(g);

            nodeRefs.push({
                id: p.id, pulse, dot, label,
                bx: p.x, by: p.y,
                phx: Math.random()*Math.PI*2,
                phy: Math.random()*Math.PI*2,
                freqx: 0.12 + Math.random()*0.10,
                freqy: 0.10 + Math.random()*0.10,
            });
        });

        // ============================================================
        //  DERIVA AMBIENTAL
        // ============================================================
        function driftPos(n, t){
            const dx = Math.sin(t * n.freqx + n.phx) * DRIFT_AMP;
            const dy = Math.cos(t * n.freqy + n.phy) * DRIFT_AMP;
            return {x: n.bx + dx, y: n.by + dy};
        }

        function frame(now){
            const t = now / 1000;
            const pos = {};
            nodeRefs.forEach(n => {
                const p = driftPos(n, t);
                pos[n.id] = p;
                n.pulse.setAttribute('cx', p.x); n.pulse.setAttribute('cy', p.y);
                n.dot.setAttribute('cx', p.x);   n.dot.setAttribute('cy', p.y);
                n.label.setAttribute('x', p.x);  n.label.setAttribute('y', p.y - 14);
            });
            lineRefs.forEach(L => {
                const A = pos[L.a], B = pos[L.b];
                L.el.setAttribute('x1', A.x); L.el.setAttribute('y1', A.y);
                L.el.setAttribute('x2', B.x); L.el.setAttribute('y2', B.y);
            });
            requestAnimationFrame(frame);
        }
        if (driftOn) requestAnimationFrame(frame);

        // ============================================================
        //  PANEL DE INFO CON ENLACES
        // ============================================================
        const panel = document.getElementById('panel');
        const linkMap = {
            'oslo': 'oslo.html',
            'bergen': 'bergen.html',
            'sogn': 'sognefjord.html'
        };

        function select(p){
            document.getElementById('p-name').textContent = p.name;
            const pLink = document.getElementById('p-link');

            // Si tiene link, muestra el botón
            if (linkMap[p.id]) {
                pLink.href = linkMap[p.id];
                pLink.style.display = 'inline-block';
                document.getElementById('p-country').textContent = p.country;
            } else {
                // Si no, muestra "PRÓXIMAMENTE" sin botón
                pLink.style.display = 'none';
                document.getElementById('p-country').textContent = 'PRÓXIMAMENTE';
            }
            panel.style.display = 'block';
        }

        document.getElementById('p-close').addEventListener('click', () => panel.style.display = 'none');

        // ============================================================
        //  NAVEGACION: PAN + ZOOM VIA VIEWBOX
        // ============================================================
        const svg = document.getElementById('map');
        const wrap = document.getElementById('wrap');
        let vb = {x:0, y:0, w:1000, h:560};
        const home = {x:0, y:0, w:1000, h:560};
        function apply(){ svg.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h); }

        wrap.addEventListener('wheel', e => {
            e.preventDefault();
            const r = svg.getBoundingClientRect();
            const mx = vb.x + (e.clientX - r.left) / r.width  * vb.w;
            const my = vb.y + (e.clientY - r.top)  / r.height * vb.h;
            const f = e.deltaY < 0 ? 0.88 : 1.14;
            const nw = Math.min(1000, Math.max(200, vb.w * f));
            const nh = nw * (560 / 1000);
            vb.x = mx - (mx - vb.x) * (nw / vb.w);
            vb.y = my - (my - vb.y) * (nh / vb.h);
            vb.w = nw; vb.h = nh;
            apply();
        }, {passive:false});

        let drag = false, sx, sy;
        wrap.addEventListener('pointerdown', e => {
            drag = true; sx = e.clientX; sy = e.clientY;
            wrap.classList.add('grabbing');
            wrap.setPointerCapture(e.pointerId);
        });
        wrap.addEventListener('pointermove', e => {
            if (!drag) return;
            const r = svg.getBoundingClientRect();
            vb.x -= (e.clientX - sx) / r.width  * vb.w;
            vb.y -= (e.clientY - sy) / r.height * vb.h;
            sx = e.clientX; sy = e.clientY;
            apply();
        });
        wrap.addEventListener('pointerup', () => { drag = false; wrap.classList.remove('grabbing'); });

        // Animación de scroll para el título (del norge2026 original)
        const headerTitle = document.getElementById('header-title');
        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY;
            const translateY = scrollPos * 0.8;
            const opacity = 1 - (scrollPos / 200);
            if (opacity >= 0) {
                headerTitle.style.transform = `translateY(-${translateY}px)`;
                headerTitle.style.opacity = opacity;
            }
        });

        apply();
    </script>

    <footer>
        <p class="footer-text">&copy; 2026 Carlos Méndez Blanco</p>
    </footer>

</body>
</html>
