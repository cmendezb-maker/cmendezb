<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugares y Momentos - Mapa Interactivo Ajustado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f6f2;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-weight: 800;
            font-size: clamp(2rem, 12vw, 4rem);
            letter-spacing: -0.05em;
            text-transform: uppercase;
            line-height: 0.8;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .map-wrapper {
            position: relative;
            background: white;
            border: 1px solid #e4e2d9;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.05);
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
            background: #fafaf8;
        }

        /* Estilos SVG */
        path {
            fill: #e8e6e1;
            stroke: #bbb;
            stroke-width: 0.3;
        }

        .dot {
            cursor: pointer;
            transition: r 0.2s ease;
        }
        .dot:hover {
            filter: drop-shadow(0 0 6px rgba(0,0,0,.3));
        }
        .dot-label {
            pointer-events: none;
            font-size: 10px;
            font-weight: 600;
            text-anchor: middle;
            fill: #1c1c1a;
        }
        .tooltip {
            position: fixed;
            background: #1c1c1a;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            pointer-events: none;
            white-space: nowrap;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.2s;
            display: none;
        }
        .tooltip.show {
            opacity: 1;
            display: block;
        }
        .legend {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            border: 1px solid #e4e2d9;
        }
        .legend h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .legend-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: 1px solid #1c1c1a;
            flex-shrink: 0;
        }
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 0.8rem;
        }
    </style>
</head>

            // Francia (en el path principal, alrededor de x~290-380, y~220-330)
            { id: 'par', name: 'Paris', country: 'Francia', x: 325, y: 250, color: '#C4B7D9' },

            // Península Ibérica - Portugal (PT path: x~110-290, y~257-410)
            { id: 'azores', name: 'Azores', country: 'Portugal', x: 115, y: 280, color: '#A7C4B5' },
            { id: 'opo', name: 'Oporto', country: 'Portugal', x: 225, y: 260, color: '#A7C4B5' },
            { id: 'lis', name: 'Lisboa', country: 'Portugal', x: 225, y: 285, color: '#A7C4B5' },

            // Italia (IT path: x~393-580, y~313-420)
            // Venecia en el norte: x~430-450, y~305-330
            // Roma en el centro-sur: x~430-460, y~350-380
            { id: 'ven', name: 'Venecia', country: 'Italia', x: 425, y: 318, color: '#E3B4A0' },
            { id: 'rom', name: 'Roma', country: 'Italia', x: 425, y: 345, color: '#E3B4A0' },

            // Turquía (TR path: x~578-760, y~342-430) - CORRECCIÓN: Estambul en x~620-650
            { id: 'ist', name: 'Estambul', country: 'Turquia', x: 575, y: 340, color: '#9ECDCB' },

            // China (path principal: x~514-850, y~89-210)
            // Beijing en el norte: x~620-650, y~140-170
            // Shanghai en el este: x~680-700, y~180-210
            { id: 'pek', name: 'Pekin', country: 'China', x: 640, y: 155, color: '#E9A8A0' },
            { id: 'sha', name: 'Shanghai', country: 'China', x: 645, y: 187, color: '#E9A8A0' },

            // Japón (JP path: x~685-750, y~160-350)
            { id: 'tok', name: 'Tokio', country: 'Japon', x: 715, y: 200, color: '#F2C6CE' },
            { id: 'kio', name: 'Kioto', country: 'Japon', x: 715, y: 215, color: '#F2C6CE' },
            { id: 'hir', name: 'Hiroshima', country: 'Japon', x: 720, y: 230, color: '#F2C6CE' },
            { id: 'miy', name: 'Miyajima', country: 'Japon', x: 700, y: 245, color: '#F2C6CE' }
        ];

        const activeLinks = ['oslo', 'bergen', 'sogn', 'rom','ber'];
        const linkMap = {
            'rom': 'roma.html',
            'oslo': 'oslo.html',
            'bergen': 'bergen.html',
            'sogn': 'sognefjord.html',

            'ber': 'berlin.html'
        };

        const NS = 'http://www.w3.org/2000/svg';
        const pointsGroup = document.getElementById('points');
        const labelsGroup = document.getElementById('labels');
        const tooltip = document.getElementById('tooltip');

        function addPlace(newPlace) {
            places.push(newPlace);
            render();
            console.log(`✓ Localidad agregada: ${newPlace.name}`);
        }

        function removePlace(placeId) {
            const index = places.findIndex(p => p.id === placeId);
            if (index > -1) {
                const removed = places.splice(index, 1)[0];
                render();
                console.log(`✓ Localidad eliminada: ${removed.name}`);
            }
        }

        function updatePlace(placeId, updates) {
            const place = places.find(p => p.id === placeId);
            if (place) {
                Object.assign(place, updates);
                render();
                console.log(`✓ Localidad actualizada: ${place.name}`);
            }
        }

        function getPlacesByCountry(country) {
            return places.filter(p => p.country === country);
        }

        function render() {
            pointsGroup.innerHTML = '';
            labelsGroup.innerHTML = '';

            places.forEach(place => {
                const dot = document.createElementNS(NS, 'circle');
                dot.setAttribute('cx', place.x);
                dot.setAttribute('cy', place.y);
                dot.setAttribute('r', '5');
                dot.setAttribute('fill', place.color);
                dot.setAttribute('stroke', 'white');
                dot.setAttribute('stroke-width', '1.5');
                dot.setAttribute('class', 'dot');

                dot.addEventListener('mouseenter', (e) => {
                    dot.setAttribute('r', '7');
                    const hasLink = activeLinks.includes(place.id);
                    tooltip.textContent = hasLink ?
                        'IR A ' + place.name.toUpperCase() :
                        'PRÓXIMAMENTE';
                    tooltip.classList.add('show');
                    tooltip.style.left = (e.clientX - 50) + 'px';
                    tooltip.style.top = (e.clientY - 40) + 'px';
                });

                dot.addEventListener('mouseleave', () => {
                    dot.setAttribute('r', '5');
                    tooltip.classList.remove('show');
                });

                dot.addEventListener('click', () => {
                    if (activeLinks.includes(place.id) && linkMap[place.id]) {
                        window.location.href = linkMap[place.id];
                    }
                });

                pointsGroup.appendChild(dot);

                const label = document.createElementNS(NS, 'text');
                label.setAttribute('x', place.x);
                label.setAttribute('y', place.y - 10);
                label.setAttribute('class', 'dot-label');
                label.textContent = place.name;
                labelsGroup.appendChild(label);
            });

            updateLegend();
        }

        function updateLegend() {
            const legend = document.getElementById('legend');
            legend.innerHTML = '';

            const byCountry = {};
            places.forEach(p => {
                if (!byCountry[p.country]) byCountry[p.country] = [];
                byCountry[p.country].push(p);
            });

            Object.entries(byCountry).sort().forEach(([country, items]) => {
                const item = document.createElement('div');
                item.className = 'legend-item';

                const dot = document.createElement('div');
                dot.className = 'legend-dot';
                dot.style.backgroundColor = items[0].color;

                const text = document.createElement('span');
                text.textContent = `${country} (${items.length})`;

                item.appendChild(dot);
                item.appendChild(text);
                legend.appendChild(item);
            });
        }

        render();
        console.log('✓ Mapa cargado con coordenadas AJUSTADAS. Métodos: addPlace, removePlace, updatePlace, getPlacesByCountry');
    </script>
</body>
</html>
