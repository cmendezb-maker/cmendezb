<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugares y Momentos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f6f2;
        }
        .header {
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header h1 {
            font-weight: 800;
            font-size: clamp(2.5rem, 12vw, 8rem);
            letter-spacing: -0.05em;
            text-transform: uppercase;
            line-height: 0.8;
        }
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 24px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-auto-rows: auto;
            gap: 16px;
            margin-bottom: 60px;
            align-items: start;
        }
        .country-card {
            border: 3px solid #1c1c1a;
            border-radius: 4px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            height: auto;
        }
        .country-card.single-city {
            justify-content: center;
            cursor: pointer;
        }
        .country-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,.15);
        }
        .cities {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .city {
            font-size: 15px;
            font-weight: 500;
            color: #000;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 6px 0;
            transition: opacity 0.2s;
            text-align: left;
        }
        .city:hover {
            opacity: 0.7;
            font-weight: 600;
        }
        .city::before {
            content: "■";
            font-size: 8px;
            flex-shrink: 0;
        }
        .city.has-link {
            font-weight: 600;
        }
        .city.no-link {
            color: #000;
            opacity: 0.85;
        }
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #888;
            font-size: 0.8rem;
        }
        .tooltip {
            position: fixed;
            background: #1c1c1a;
            color: white;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            pointer-events: none;
            white-space: nowrap;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .tooltip.show { opacity: 1; }

        /* Posiciones geográficas */
        .card-ny { grid-column: 1; grid-row: 1; }

        .card-uk { grid-column: 2; grid-row: 1; }
        .card-fr { grid-column: 2; grid-row: 2; }
        .card-pt { grid-column: 2; grid-row: 3; }

        .card-nl { grid-column: 3; grid-row: 1; }
        .card-de { grid-column: 3; grid-row: 2; }

        .card-no { grid-column: 4; grid-row: 1; }
        .card-dk { grid-column: 4; grid-row: 2; }

        .card-tr { grid-column: 5; grid-row: 3; }

        .card-it { grid-column: 4; grid-row: 3; }

        .card-ch { grid-column: 5; grid-row: 1; }
        .card-jp { grid-column: 6; grid-row: 1; }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            /* Tablet: Redistribute cards in 3-column layout */
            .card-ny { grid-column: 1; grid-row: 1; }
            .card-uk { grid-column: 2; grid-row: 1; }
            .card-nl { grid-column: 3; grid-row: 1; }
            .card-pt { grid-column: 1; grid-row: 2; }
            .card-fr { grid-column: 2; grid-row: 2; }
            .card-de { grid-column: 3; grid-row: 2; }
            .card-no { grid-column: 1; grid-row: 3; }
            .card-dk { grid-column: 2; grid-row: 3; }
            .card-ch { grid-column: 3; grid-row: 3; }
            .card-it { grid-column: 1; grid-row: 4; }
            .card-tr { grid-column: 2; grid-row: 4; }
            .card-jp { grid-column: 3; grid-row: 4; }
        }
        @media (max-width: 768px) {
            .header h1 {
                font-size: clamp(1.8rem, 8vw, 3.5rem);
            }
        }
        @media (max-width: 640px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            /* Mobile: 2-column layout with logical flow */
            .card-ny { grid-column: 1; grid-row: 1; }
            .card-uk { grid-column: 2; grid-row: 1; }
            .card-nl { grid-column: 1; grid-row: 2; }
            .card-de { grid-column: 2; grid-row: 2; }
            .card-pt { grid-column: 1; grid-row: 3; }
            .card-fr { grid-column: 2; grid-row: 3; }
            .card-no { grid-column: 1; grid-row: 4; }
            .card-dk { grid-column: 2; grid-row: 4; }
            .card-ch { grid-column: 1; grid-row: 5; }
            .card-jp { grid-column: 2; grid-row: 5; }
            .card-it { grid-column: 1; grid-row: 6; }
            .card-tr { grid-column: 2; grid-row: 6; }

            .container {
                padding: 0 12px;
                margin: 20px auto;
            }
            .header {
                padding: 20px 12px;
            }
            .country-card {
                padding: 16px;
                border-width: 2px;
            }
            .city {
                font-size: 14px;
                padding: 4px 0;
            }
        }
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            /* Extra small phones: Single column */
            .card-ny { grid-column: 1; grid-row: auto; }
            .card-uk { grid-column: 1; grid-row: auto; }
            .card-nl { grid-column: 1; grid-row: auto; }
            .card-de { grid-column: 1; grid-row: auto; }
            .card-pt { grid-column: 1; grid-row: auto; }
            .card-fr { grid-column: 1; grid-row: auto; }
            .card-no { grid-column: 1; grid-row: auto; }
            .card-dk { grid-column: 1; grid-row: auto; }
            .card-ch { grid-column: 1; grid-row: auto; }
            .card-jp { grid-column: 1; grid-row: auto; }
            .card-it { grid-column: 1; grid-row: auto; }
            .card-tr { grid-column: 1; grid-row: auto; }

            .header h1 {
                font-size: clamp(1.5rem, 6vw, 2.5rem);
            }
            .container {
                padding: 0 8px;
            }
            .country-card {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>LUGARES Y MOMENTOS</h1>
    </div>

    <div class="container">
        <div class="grid" id="grid"></div>
    </div>

    <footer>&copy; 2026 Carlos Méndez Blanco</footer>
    <div class="tooltip" id="tooltip"></div>

    <script>
        // ============================================================
        // CONFIGURACIÓN FÁCIL: Cambia colores y posiciones aquí
        // ============================================================
        const config = {
            'EE. UU.': {
                color: '#9DB4D4',
                position: 'card-ny',
                cities: ['New York']
            },
            'Reino Unido': {
                color: '#D89B94',
                position: 'card-uk',
                cities: ['Highlands', 'Edimburgo', 'Kingston-upon-Hull', 'Londres']
            },
            'Paises Bajos': {
                color: '#F5C99B',
                position: 'card-nl',
                cities: ['Amsterdam']
            },
            'Alemania': {
                color: '#E8D097',
                position: 'card-de',
                cities: ['Berlin']
            },
            'Noruega': {
                color: '#B8CEDD',
                position: 'card-no',
                cities: ['Sognefjord', 'Bergen', 'Oslo']
            },
            'Portugal': {
                color: '#A7C4B5',
                position: 'card-pt',
                cities: ['Azores', 'Oporto', 'Lisboa']
            },
            'Francia': {
                color: '#C4B7D9',
                position: 'card-fr',
                cities: ['Paris']
            },
            'Dinamarca': {
                color: '#E0A9A0',
                position: 'card-dk',
                cities: ['Copenhague']
            },
            'China': {
                color: '#E9A8A0',
                position: 'card-ch',
                cities: ['Beijing', 'Shanghai']
            },
            'Japon': {
                color: '#F2C6CE',
                position: 'card-jp',
                cities: ['Tokyo', 'Kyoto', 'Hiroshima', 'Miyajima']
            },
            'Italia': {
                color: '#E3B4A0',
                position: 'card-it',
                cities: ['Venecia', 'Roma']
            },
            'Turquia': {
                color: '#9ECDCB',
                position: 'card-tr',
                cities: ['Istanbul']
            }
        };

        // Links activos - fácil de cambiar
        const linkMap = {
            'Bergen': 'berge.html',
            'Oslo': 'oslo.html',
            'Berlin': 'berlin.html'
        };

        // ============================================================
        // Renderizado
        // ============================================================
        const grid = document.getElementById('grid');
        const tooltip = document.getElementById('tooltip');

        Object.keys(config).forEach(country => {
            const data = config[country];
            const isSingleCity = data.cities.length === 1;

            const card = document.createElement('div');
            card.className = 'country-card ' + data.position;
            if (isSingleCity) {
                card.classList.add('single-city');
            }
            card.style.backgroundColor = data.color;

            const citiesContainer = document.createElement('div');
            citiesContainer.className = 'cities';

            data.cities.forEach(cityName => {
                const cityEl = document.createElement('div');
                cityEl.className = 'city';

                if (linkMap[cityName]) {
                    cityEl.classList.add('has-link');
                } else {
                    cityEl.classList.add('no-link');
                }

                cityEl.textContent = cityName;

                // Hover tooltip
                cityEl.addEventListener('mouseenter', (e) => {
                    if (linkMap[cityName]) {
                        tooltip.textContent = 'IR A ' + cityName.toUpperCase();
                    } else {
                        tooltip.textContent = 'PRÓXIMAMENTE';
                    }
                    tooltip.classList.add('show');
                    tooltip.style.left = (e.pageX - 50) + 'px';
                    tooltip.style.top = (e.pageY - 40) + 'px';
                });

                cityEl.addEventListener('mouseleave', () => {
                    tooltip.classList.remove('show');
                });

                // Click en el nombre de la ciudad (solo si hay múltiples)
                if (!isSingleCity) {
                    cityEl.addEventListener('click', () => {
                        if (linkMap[cityName]) {
                            window.location.href = linkMap[cityName];
                        }
                    });
                }

                citiesContainer.appendChild(cityEl);
            });

            card.appendChild(citiesContainer);

            // Click en el card completo (solo si es una sola ciudad)
            if (isSingleCity) {
                const singleCity = data.cities[0];
                card.addEventListener('click', () => {
                    if (linkMap[singleCity]) {
                        window.location.href = linkMap[singleCity];
                    }
                });
            }

            grid.appendChild(card);
        });

        console.log('Grid cargada');
    </script>
</body>
</html>
